<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Antalya Doğrulama</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css"></head><body>
<div class="center"><div class="hero">
  <div class="panel">
    <img class="banner" src="/ao.webp" alt="AO&D">
    <h2 style="margin:0">Antalya Sunucusu Doğrulama</h2>
    <div id="form" style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <input id="name" placeholder="Discord adın" maxlength="40" autocomplete="off">
      <button id="btn" class="big">Verify</button>
    </div>
    <div id="done" class="checkwrap">
      <svg viewBox="0 0 56 56"><circle class="circ" cx="28" cy="28" r="26"/><path class="tick" d="M16 29 l8 8 l16 -17"/></svg>
      <div id="doneTxt" style="font-weight:600"></div>
    </div>
    <div id="msg" class="msg"></div>
    <div class="notice">🔒 <b>Gizlilik:</b> Tarayıcıdan izin istenmez. Yalnızca IP adresine göre yaklaşık yerin (il) <b>sadece sunucu yetkililerine</b> iletilir. Doğrulama tamamlandığında bilgilerin <b>otomatik olarak silinir</b>.</div>
  </div>
  <img class="shot" src="/foto.webp" alt="">
</div></div>
<script>
const $=s=>document.querySelector(s);
let cid=localStorage.getItem('cid'); if(!cid){cid=crypto.randomUUID();localStorage.setItem('cid',cid);}
let id=localStorage.getItem('rid'), saved=localStorage.getItem('rname');
const btn=$('#btn'), msg=$('#msg'), name=$('#name');

function showCheck(txt){
  $('#form').style.display='none';
  $('#done').style.display='flex'; $('#doneTxt').textContent=txt;
}
function show(status){
  if(saved) name.value=saved;
  btn.disabled=true; name.disabled=true;
  if(status==='approved'){showCheck('Onaylandın! Discord\'a dönebilirsin.');msg.textContent='';return true;}
  if(status==='rejected'){$('#form').style.display='none';msg.textContent='❌ Başvurun reddedildi.';return true;}
  showCheck('Gönderildi');
  msg.textContent='⏳ Adminin kararını bekleyiniz';return false;
}
async function poll(){
  try{
    if(!document.hidden){
      const r=await (await fetch('/api/status/'+id)).json();
      if(r.status==='none'){localStorage.removeItem('rid');location.reload();return;}
      if(show(r.status))return;
    }
  }catch{}
  setTimeout(poll,10000);
}
if(id){show('pending');poll();}

btn.onclick=async()=>{
  const n=name.value.trim();
  if(n.length<2){msg.textContent='Önce adını yaz.';return;}
  btn.disabled=true; msg.textContent='Gönderiliyor…';
  try{
    const r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:n,cid})});
    const j=await r.json();
    if(!r.ok){msg.textContent=j.error||'Hata';btn.disabled=false;return;}
    id=j.id;saved=n;localStorage.setItem('rid',id);localStorage.setItem('rname',n);
    if(!show(j.status))setTimeout(poll,10000);
  }catch{msg.textContent='Bağlantı hatası, tekrar dene.';btn.disabled=false;}
};
</script></body></html>
